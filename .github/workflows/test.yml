name: Test

# Runs on PRs (including forks) and pushes to main. Uses `pull_request`, not
# `pull_request_target`: code from a fork runs with a read-only token and no
# access to secrets.
on:
  pull_request:
  push:
    branches: [main]

# The token can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA, so a moved tag
      # can't swap in other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependencies' install scripts don't run in CI.
      - run: npm ci --ignore-scripts

      - run: npm test
